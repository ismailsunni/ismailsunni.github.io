# Home for pnpm settings that older pnpm versions read from package.json's "pnpm" field.
# These overrides pin transitive deps to patched versions — keep them in sync intentionally.
overrides:
  fast-xml-parser: ^5.7.0
  devalue: ^5.8.1
  immutable: ^4.3.8
  glob: ^10.5.0
  minimatch: ^9.0.7
  braces: ^3.0.3
  micromatch: ^4.0.8
  cross-spawn: ^7.0.5
  nanoid: ^3.3.8
  postcss: ^8.5.10
  yaml: ^2.8.3
  brace-expansion: ^2.0.3
  mdast-util-to-hast: ^13.2.1

allowBuilds:
  esbuild: true
  sharp: true
  vue-demi: true
